<div class="dashboard-container">
  <!-- Left Sidebar Navigation -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="logo-container">
        <div class="logo-icon">+</div>
        <span class="logo-text">MediScribe AI</span>
      </div>

      <nav class="nav-section" aria-label="Admin navigation">
        <p class="nav-header">NAVIGATION</p>

        <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
           #dashLink="routerLinkActive" class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
          </svg>
          Dashboard
          @if (dashLink.isActive) { <span class="active-dot"></span> }
        </a>

        <a routerLink="/admin/doctors" routerLinkActive="active" #doctorsLink="routerLinkActive" class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="8.5" cy="7" r="4"></circle>
            <line x1="20" y1="8" x2="20" y2="14"></line>
            <line x1="23" y1="11" x2="17" y2="11"></line>
          </svg>
          Doctors
          @if (doctorsLink.isActive) { <span class="active-dot"></span> }
        </a>

        <a routerLink="/admin/patients" routerLinkActive="active" #patientsLink="routerLinkActive" class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          Patients
          @if (patientsLink.isActive) { <span class="active-dot"></span> }
        </a>

        <a routerLink="/admin/accounts" routerLinkActive="active" #accountsLink="routerLinkActive" class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          Accounts
          @if (accountsLink.isActive) { <span class="active-dot"></span> }
        </a>
      </nav>
    </div>
  </aside>

  <!-- Main Content Layout -->
  <main class="main-wrapper">
    <header class="top-header">
      <div class="header-user">
        <div class="user-text">
          <span class="user-name">{{ adminName }}</span>
          <span class="user-role">Administrator</span>
        </div>
        <div class="user-avatar">{{ adminName | initials }}</div>
        <button type="button" class="sign-out-btn" (click)="signOut()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="signout-icon" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Sign out
        </button>
      </div>
    </header>

    <!-- Child route pages render here -->
    <div class="content-body">
      <router-outlet />
    </div>
  </main>
</div>
