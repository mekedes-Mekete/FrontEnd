<div class="dashboard-container">
  <!-- Left Sidebar Navigation -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="logo-container">
        <div class="logo-icon">+</div>
        <span class="logo-text">MediScribe AI</span>
      </div>

      <nav class="nav-section">
        <p class="nav-header">NAVIGATION</p>
        <a href="#" class="nav-item active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
          </svg>
          Dashboard
          <span class="active-dot"></span>
        </a>
        <a href="#" class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          Patients
        </a>
        <a href="#" class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="8.5" cy="7" r="4"></circle>
            <line x1="20" y1="8" x2="20" y2="14"></line>
            <line x1="23" y1="11" x2="17" y2="11"></line>
          </svg>
          Doctors
        </a>
      </nav>
    </div>
  </aside>

  <!-- Main Content Layout -->
  <main class="main-wrapper">
    <!-- Top Header -->
    <header class="top-header">
      <div class="header-user">
        <div class="user-text">
          <span class="user-name">{{ adminUser.name }}</span>
          <span class="user-role">{{ adminUser.role }}</span>
        </div>
        <div class="user-avatar">{{ adminUser.initials }}</div>
        <button class="sign-out-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="signout-icon">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Sign out
        </button>
      </div>
    </header>

    <!-- Page Content Body -->
    <div class="content-body">
      <h1 class="page-title">Dashboard</h1>

      <div class="cards-grid">
        <!-- Doctors Summary Card -->
        <section class="summary-card">
          <div class="card-header">
            <div class="icon-badge teal-badge">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="8.5" cy="7" r="4"></circle>
                <line x1="20" y1="8" x2="20" y2="14"></line>
                <line x1="23" y1="11" x2="17" y2="11"></line>
              </svg>
            </div>
            <button class="arrow-btn" aria-label="Go to doctors">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </div>

          <h2 class="card-title">Doctors</h2>

          <div class="list-container">
            <div *ngFor="let doc of doctors" class="list-item">
              <div class="item-left">
                <div class="avatar doctor-avatar">{{ doc.initials }}</div>
                <div class="item-info">
                  <span class="item-name">{{ doc.name }}</span>
                  <span class="item-subtext">{{ doc.specialty }}</span>
                </div>
              </div>
              <button class="view-btn" (click)="onViewDoctorDetails(doc.id)">View details</button>
            </div>
          </div>
        </section>

        <!-- Patients Summary Card (With Email) -->
        <section class="summary-card">
          <div class="card-header">
            <div class="icon-badge green-badge">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <button class="arrow-btn" aria-label="Go to patients">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </div>

          <h2 class="card-title">Patients</h2>

          <div class="list-container">
            <div *ngFor="let pat of patients" class="list-item">
              <div class="item-left">
                <div class="avatar patient-avatar">{{ pat.initials }}</div>
                <div class="item-info">
                  <span class="item-name">{{ pat.name }}</span>
                  <span class="item-subtext">{{ pat.email }}</span>
                </div>
              </div>
              <button class="view-btn" (click)="onViewPatientDetails(pat.id)">View details</button>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>
